spring:
  application:
    name: shortener-service
  # Activates AsyncConfig's @Profile("!test") exclusion, so click tracking runs synchronously
  # on the calling thread during tests instead of on the real background thread pool -- see
  # AsyncConfig's javadoc for why that matters (deterministic assertions, correct participation
  # in @Transactional test rollback).
  profiles:
    active: test
  datasource:
    # In-memory, not the file-based DB main uses: tests must never touch (or be polluted by)
    # whatever is sitting in ./data/shortener from a real run. DB_CLOSE_DELAY=-1 keeps the
    # in-memory instance alive for the whole test JVM fork instead of dropping it after the
    # first connection closes; @Transactional on integration test classes rolls back each test's
    # writes so tests in the same class (or different classes sharing this fork) don't see each
    # other's data.
    url: jdbc:h2:mem:shortener-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # A REQUIRES_NEW transaction (FirstClickInserter) suspends the caller's connection and
      # acquires a second one for its own duration, so a thread mid-flight through
      # JpaClickStatsRepository.recordClick can briefly hold two at once. The default pool size
      # (10) was too small under concurrent load on that path and produced a genuine
      # connection-pool deadlock (every connection held by a thread waiting for a second one
      # that could never free up), found while stress-testing click recording by hand. Matches
      # the same reasoning as the production config's hikari.maximum-pool-size.
      maximum-pool-size: 50
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Lets tests assert on Statistics.getPreparedStatementCount() to prove the cache
        # actually prevents a second DB hit, rather than only asserting the returned value is
        # correct (which would pass even with no caching at all).
        generate_statistics: true
    open-in-view: false

app:
  base-url: http://localhost:8080
  rate-limit:
    create-link:
      # Generous on purpose: RateLimiter is one Spring-managed singleton shared by every test
      # class in this JVM fork, not reset between tests. A low limit here would make ordinary
      # API tests start failing with spurious 429s once enough of them (across the whole suite)
      # had each made one create-link call. RateLimitFilterTest overrides this bean with a low
      # limit in its own isolated Spring context specifically to test the throttling behavior,
      # rather than lowering it here for everyone.
      max-requests: 1000
      window-seconds: 60
